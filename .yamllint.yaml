extends: default

rules:
  # GitHub Actions uses `on:` as a key, which YAML 1.1 reads as a boolean.
  truthy:
    check-keys: false
  line-length:
    max: 120
    # An image pinned by digest is one long word that cannot be broken.
    allow-non-breakable-inline-mappings: true
  document-start: disable
  comments:
    min-spaces-from-content: 1

ignore: |
  node_modules/
  target/
  dist/
