# A single Loki process with local storage, enough for one laptop.
# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn
  # A query over a bad incident returns thousands of long stack traces; the 4 MB default between the
  # querier and the frontend is too small for that, and the query fails with a 504.
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

frontend_worker:
  grpc_client_config:
    max_recv_msg_size: 16777216
    max_send_msg_size: 16777216
