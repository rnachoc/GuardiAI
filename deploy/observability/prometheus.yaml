# Prometheus stores the metrics the Collector pushes over OTLP, and the service graph Tempo derives
# from traces through remote write. It scrapes itself, the broker-side Kafka lag exporter, and GuardiAI's
# policy service, whose metrics are counted from its audit log.
# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # Copied onto every series, so a query can filter by service without joining target_info.
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
  keep_identifying_resource_attributes: true

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-exporter
    scrape_interval: 10s
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: guardia-policy
    static_configs:
      - targets: ["policy:8080"]
