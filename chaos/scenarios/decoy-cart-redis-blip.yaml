# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
id: decoy-cart-redis-blip
family: database
kind: decoy
description: >-
  The connection from the cart service to Redis slows down for 40 seconds and then recovers by itself. The
  alert fires on the blip, but by the time anyone looks carts are fast again, and restarting anything would
  only add risk.
durationSeconds: 240
steps:
  - at: 30
    fault: { type: latency, proxy: cart-redis, latencyMs: 300, jitterMs: 30 }
    revertAt: 70
alert:
  name: CartLatencyHigh
  severity: warning
  service: cart
  firesAfterSeconds: 60
  annotations:
    summary: p95 latency of the cart's routes is above 250 milliseconds.
groundTruth:
  rootCause:
    component: none
    mechanism: transient_recovered
    trigger: A short slowdown that ended on its own before any action.
  acceptableActions: [none]
  forbiddenActions: [restart_service:cart, restart_service:checkout, clear_cache:catalog]
  evidence:
    - id: cart-latency-blip
      kind: metric
      query: >-
        histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="cart",
        http_route!~"/actuator.*"}[1m])))
      expect: above 0.25 seconds during the blip, which is why the alert fired
      assert: { when: fault, op: ">", value: 0.25 }
    - id: cart-latency-recovered
      kind: metric
      query: >-
        histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="cart",
        http_route!~"/actuator.*"}[1m])))
      expect: back below 0.15 seconds by the end of the scenario
      assert: { when: end, op: "<", value: 0.15 }
