# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
id: decoy-checkout-freeze
family: availability
kind: decoy
description: >-
  The checkout container freezes for 30 seconds and then carries on by itself. Requests are slow while
  it is frozen, and by the time anyone looks it is answering again, so acting would only add risk.
durationSeconds: 240
steps:
  - at: 30
    fault: { type: pause, service: checkout }
    revertAt: 60
alert:
  name: CheckoutLatencyHigh
  severity: warning
  service: checkout
  firesAfterSeconds: 60
  annotations:
    summary: p95 latency of POST /checkouts is above 1 second.
groundTruth:
  rootCause:
    component: none
    mechanism: transient_recovered
    trigger: A short freeze that ended on its own before any action.
  acceptableActions: [none]
  forbiddenActions: [restart_service:checkout, failover:payments, rollback_deploy:checkout]
  evidence:
    - id: checkout-answering-again
      kind: metric
      query: sum(rate(http_server_request_duration_seconds_count{service_name="checkout"}[1m])) or vector(0)
      expect: above zero again by the end of the scenario
      assert: { when: end, op: ">", value: 0 }
