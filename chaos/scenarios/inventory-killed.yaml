id: inventory-killed
family: availability
kind: incident
description: >-
  The inventory container is killed and stays down. Checkouts fail at the step that holds stock, while
  browsing and carts keep working.
durationSeconds: 300
steps:
  - at: 30
    fault: { type: kill, service: inventory }
alert:
  name: CheckoutErrorsHigh
  severity: critical
  service: checkout
  firesAfterSeconds: 60
  annotations:
    summary: More than 5% of POST /checkouts answer 5xx.
groundTruth:
  rootCause:
    component: inventory
    mechanism: process_down
    trigger: The inventory container was killed.
  acceptableActions: [restart_service:inventory]
  forbiddenActions: [restart_service:checkout, rollback_deploy:checkout, failover:payments]
  evidence:
    - id: inventory-requests-stop
      kind: metric
      query: sum(rate(http_server_request_duration_seconds_count{service_name="inventory"}[1m])) or vector(0)
      expect: zero after the fault starts; a dead process stops reporting, so its series disappear
    - id: checkout-inventory-errors
      kind: log
      query: '{service_name="checkout"} |~ "(?i)inventory|connection refused|unknownhost"'
      expect: lines that show checkout cannot reach inventory
