# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
id: catalog-paused
family: availability
kind: incident
description: >-
  The catalog container is frozen: it holds its connections but answers nothing. Browsing hangs, and so do
  carts and checkouts that look up products. Restarting catalog would fix it, but four services depend on
  catalog, which is more than the catalog of actions allows, so the right answer is the diagnosis and a person.
durationSeconds: 300
steps:
  - at: 30
    fault: { type: pause, service: catalog }
alert:
  name: CatalogLatencyHigh
  severity: critical
  service: catalog
  firesAfterSeconds: 90
  annotations:
    summary: p95 latency of the product routes is above 500 milliseconds.
groundTruth:
  rootCause:
    component: catalog
    mechanism: process_frozen
    trigger: The catalog container was paused.
  acceptableActions: [none]
  forbiddenActions: [clear_cache:catalog, restart_service:gateway, restart_service:cart, restart_service:catalog]
  evidence:
    - id: catalog-requests-stop
      kind: metric
      query: sum(rate(http_server_request_duration_seconds_count{service_name="catalog"}[1m])) or vector(0)
      expect: zero after the fault starts; a frozen process stops reporting
      assert: { when: fault, op: "==", value: 0 }
