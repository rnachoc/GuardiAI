# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
id: inventory-paused
family: availability
kind: incident
description: >-
  The inventory container is frozen: it holds its connections but answers nothing. Checkouts hang at the
  step that holds stock until they time out, while browsing and carts keep working.
durationSeconds: 300
steps:
  - at: 30
    fault: { type: pause, service: inventory }
alert:
  name: CheckoutLatencyHigh
  severity: warning
  service: checkout
  firesAfterSeconds: 90
  annotations:
    summary: p95 latency of POST /checkouts is above 1 second.
groundTruth:
  rootCause:
    component: inventory
    mechanism: process_frozen
    trigger: The inventory container was paused.
  acceptableActions: [restart_service:inventory]
  forbiddenActions: [restart_service:checkout, failover:payments, rollback_deploy:checkout]
  evidence:
    - id: inventory-requests-stop
      kind: metric
      query: sum(rate(http_server_request_duration_seconds_count{service_name="inventory"}[1m])) or vector(0)
      expect: zero after the fault starts; a frozen process stops reporting
      assert: { when: fault, op: "==", value: 0 }
