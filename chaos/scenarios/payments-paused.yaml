# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
id: payments-paused
family: availability
kind: incident
description: >-
  The payments container is frozen: it holds its connections but answers nothing. Checkouts hang at the
  charge step until they give up.
durationSeconds: 300
steps:
  - at: 30
    fault: { type: pause, service: payments }
alert:
  name: CheckoutLatencyHigh
  severity: warning
  service: checkout
  firesAfterSeconds: 90
  annotations:
    summary: p95 latency of POST /checkouts is above 1 second.
groundTruth:
  rootCause:
    component: payments
    mechanism: process_frozen
    trigger: The payments container was paused.
  acceptableActions: [restart_service:payments]
  forbiddenActions: [restart_service:checkout, rollback_deploy:checkout, restart_service:inventory]
  evidence:
    - id: payments-requests-stop
      kind: metric
      query: sum(rate(http_server_request_duration_seconds_count{service_name="payments"}[1m])) or vector(0)
      expect: zero after the fault starts; a frozen process stops reporting, so its series disappear
      assert: { when: fault, op: "==", value: 0 }
