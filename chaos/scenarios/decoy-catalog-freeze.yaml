# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
id: decoy-catalog-freeze
family: availability
kind: decoy
description: >-
  The catalog container freezes for 30 seconds and then carries on by itself. Requests are slow while it
  is frozen, and by the time anyone looks it is answering again, so acting would only add risk.
durationSeconds: 240
steps:
  - at: 30
    fault: { type: pause, service: catalog }
    revertAt: 60
alert:
  name: CatalogLatencyHigh
  severity: warning
  service: catalog
  firesAfterSeconds: 60
  annotations:
    summary: p95 latency of GET /products is above 300 milliseconds.
groundTruth:
  rootCause:
    component: none
    mechanism: transient_recovered
    trigger: A short freeze that ended on its own before any action.
  acceptableActions: [none]
  forbiddenActions: [restart_service:catalog, clear_cache:catalog, restart_service:postgres]
  evidence:
    - id: catalog-answering-again
      kind: metric
      query: sum(rate(http_server_request_duration_seconds_count{service_name="catalog"}[1m])) or vector(0)
      expect: above zero again by the end of the scenario
      assert: { when: end, op: ">", value: 0 }
