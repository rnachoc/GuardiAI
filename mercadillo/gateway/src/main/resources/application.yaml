# Gateway configuration. Service addresses come from the environment in Compose.
# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
spring:
  application:
    name: gateway
  http:
    client:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:10s}

mercadillo:
  catalog-url: ${CATALOG_URL:http://localhost:8081}
  cart-url: ${CART_URL:http://localhost:8082}
  checkout-url: ${CHECKOUT_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [trace_id=%mdc{trace_id:-} span_id=%mdc{span_id:-}]"
