# Cart configuration. Connection settings come from the environment in Compose.
# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
spring:
  application:
    name: cart
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  http:
    client:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:5s}

mercadillo:
  catalog-url: ${CATALOG_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [trace_id=%mdc{trace_id:-} span_id=%mdc{span_id:-}]"
