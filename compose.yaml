# The local stack: Mercadillo's services and backing stores, the observability pipeline that
# watches them, and steady synthetic shoppers. Images are pinned by digest (ADR 3), and only the
# gateway and the observability UIs are published, on 127.0.0.1.
#
# Building behind a TLS-intercepting proxy: set GUARDIA_BUILD_NETWORK=host, GUARDIA_BUILD_MAVEN_OPTS
# to the proxy's JVM settings, and GUARDIA_BUILD_TRUSTSTORE to a trust store that holds its CA.
#
# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
name: guardia

x-mercadillo-service: &mercadillo-service
  restart: unless-stopped
  mem_limit: 768m
  environment: &mercadillo-environment
    DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    DATABASE_USER: ${POSTGRES_USER}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    CATALOG_URL: http://catalog:8080
    CART_URL: http://cart:8080
    CHECKOUT_URL: http://checkout:8080
    PAYMENTS_URL: http://payments:8080
    INVENTORY_URL: http://inventory:8080
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=mercadillo,service.version=0.1.0,deployment.environment.name=local

x-mercadillo-build: &mercadillo-build
  context: ./mercadillo
  network: ${GUARDIA_BUILD_NETWORK:-default}
  secrets: [maven_truststore]

services:
  postgres:
    # 17, not 18: the Flyway that Spring Boot 3.5 manages supports PostgreSQL up to 17 (ADR 4).
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    environment:
      # One node that is both broker and controller (KRaft, no ZooKeeper).
      CLUSTER_ID: f1JObfX9RQi0FRVDBUp5OQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  catalog:
    <<: *mercadillo-service
    image: guardia/mercadillo-catalog:local
    build:
      <<: *mercadillo-build
      args:
        SERVICE: catalog
        MAVEN_OPTS: ${GUARDIA_BUILD_MAVEN_OPTS:-}
    environment:
      <<: *mercadillo-environment
      DATABASE_URL: jdbc:postgresql://catalog-db-proxy:15432/${POSTGRES_DB}
    depends_on:
      toxiproxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
  inventory:
    <<: *mercadillo-service
    image: guardia/mercadillo-inventory:local
    build:
      <<: *mercadillo-build
      args:
        SERVICE: inventory
        MAVEN_OPTS: ${GUARDIA_BUILD_MAVEN_OPTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
  payments:
    <<: *mercadillo-service
    image: guardia/mercadillo-payments:local
    build:
      <<: *mercadillo-build
      args:
        SERVICE: payments
        MAVEN_OPTS: ${GUARDIA_BUILD_MAVEN_OPTS:-}
    depends_on:
      otel-collector:
        condition: service_started
  cart:
    <<: *mercadillo-service
    image: guardia/mercadillo-cart:local
    build:
      <<: *mercadillo-build
      args:
        SERVICE: cart
        MAVEN_OPTS: ${GUARDIA_BUILD_MAVEN_OPTS:-}
    environment:
      <<: *mercadillo-environment
      REDIS_HOST: cart-redis-proxy
      REDIS_PORT: "16379"
    depends_on:
      toxiproxy:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog:
        condition: service_healthy
      otel-collector:
        condition: service_started
  checkout:
    <<: *mercadillo-service
    image: guardia/mercadillo-checkout:local
    build:
      <<: *mercadillo-build
      args:
        SERVICE: checkout
        MAVEN_OPTS: ${GUARDIA_BUILD_MAVEN_OPTS:-}
    environment:
      <<: *mercadillo-environment
      PAYMENTS_URL: http://payments-proxy:8666
      INVENTORY_URL: http://inventory-proxy:8667
    depends_on:
      toxiproxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cart:
        condition: service_healthy
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payments:
        condition: service_healthy
      otel-collector:
        condition: service_started
  notifier:
    <<: *mercadillo-service
    image: guardia/mercadillo-notifier:local
    build:
      <<: *mercadillo-build
      args:
        SERVICE: notifier
        MAVEN_OPTS: ${GUARDIA_BUILD_MAVEN_OPTS:-}
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
  gateway:
    <<: *mercadillo-service
    image: guardia/mercadillo-gateway:local
    build:
      <<: *mercadillo-build
      args:
        SERVICE: gateway
        MAVEN_OPTS: ${GUARDIA_BUILD_MAVEN_OPTS:-}
    depends_on:
      catalog:
        condition: service_healthy
      cart:
        condition: service_healthy
      checkout:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  kafka-exporter:
    # Measures consumer lag from the broker's side. The notifier reports its own lag too, but a frozen
    # or dead consumer cannot report anything, which is exactly when lag matters.
    image: danielqsj/kafka-exporter:v1.10.0@sha256:346a53c2489a3530790d01f7b96632496d0d58926662f4c35bb65f569db2ab42
    command: ["--kafka.server=kafka:9092", "--topic.filter=orders.*", "--group.filter=notifier"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9308/metrics"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  policy:
    # Judges proposals, records approvals, and executes approved ones. The only service that holds the
    # Docker socket (ADR 18). Its facts are a static file for the local stack until a collector exists.
    image: guardia/policy:local
    build:
      context: ./policy
      network: ${GUARDIA_BUILD_NETWORK:-default}
      secrets: [maven_truststore]
      args:
        MAVEN_OPTS: ${GUARDIA_BUILD_MAVEN_OPTS:-}
    environment:
      GUARDIA_RUNNER: docker
      GUARDIA_DOCKER_PROJECT: guardia
      GUARDIA_PROMETHEUS_URL: http://prometheus:9090
      GUARDIA_AUDIT_FILE: /data/audit.jsonl
      GUARDIA_FACTS_FILE: /etc/guardia/facts.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/policy/facts.json:/etc/guardia/facts.json:ro
      - policy-data:/data
    ports:
      - "127.0.0.1:8090:8080"
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
  toxiproxy:
    # Sits on four connections inside Mercadillo, so guardia-chaos can slow or cut each one (ADR 8).
    # Each connection has its own network name, which is what callers see as the server address.
    image: ghcr.io/shopify/toxiproxy:2.13.0@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/toxiproxy.json"]
    volumes:
      - ./deploy/chaos/toxiproxy.json:/etc/toxiproxy/toxiproxy.json:ro
    networks:
      default:
        aliases: [payments-proxy, inventory-proxy, catalog-db-proxy, cart-redis-proxy]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-collector:
    # The image has no shell or HTTP client for a healthcheck. Services depend on it being started,
    # and their exporters retry until it accepts data.
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  loki:
    # Its image has no shell or HTTP client for a healthcheck;
    # `make verify` checks /ready from outside.
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  tempo:
    # Its image has no shell or HTTP client for a healthcheck;
    # `make verify` checks /ready from outside.
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?copy .env.example to .env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mercadillo-overview.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  load:
    image: grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6
    command: ["run", "--quiet", "--summary-mode=disabled", "/scripts/shoppers.js"]
    environment:
      GATEWAY_URL: http://gateway:8080
      SHOPPERS_PER_SECOND: ${SHOPPERS_PER_SECOND:-4}
    volumes:
      - ./mercadillo/load:/scripts:ro
    depends_on:
      gateway:
        condition: service_healthy
      notifier:
        condition: service_healthy
    restart: unless-stopped

volumes:
  policy-data:
  postgres-data:
  kafka-data:
  prometheus-data:
  loki-data:
  tempo-data:

secrets:
  # Empty unless a proxy's trust store is given; see the note at the top.
  maven_truststore:
    file: ${GUARDIA_BUILD_TRUSTSTORE:-./mercadillo/docker/no-truststore}
